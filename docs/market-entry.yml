# 提交给 DSH 插件市场的条目 —— 原样复制到 PR：
#   awesome-dsh-plugin/awesome-dsh-plugin → data/plugins/j62268781-alt__dsh-sidebar-mobile.yml
#
# 文件名规则 <owner>__<repo>.yml；校验器只认 url / name / category / description / tarball，
# 多写键会被拒；npm 与仓库的对应关系由 CI 从 npm 的 repository 字段自动探测，
# 所以这里没有 npm 字段。
url: https://github.com/j62268781-alt/dsh-sidebar-mobile
name: j62268781-alt/dsh-sidebar-mobile
category: tools
description:
  en: 'A live mobile device panel for the DSH right sidebar: wraps the mobilecli CLI into a real-time screen with direct click/drag control, one API covering both iOS and Android (real devices, simulators and emulators). Streams at 104fps on Android over AVC/H.264 and 131fps on the iOS Simulator, plus 16 model tools, the bundled mobilecli skill registered automatically, and Flutter widget-tree reading through the Dart VM service. Zero runtime dependencies; the browser only ever talks to the DSH webserver origin, behind signed expiring capabilities and a loopback transport fence.'
  zh: 'DSH 右侧边栏的移动设备面板：把 mobilecli 封装成实时画面 + 直接点击拖拽操作，一套 API 同时覆盖 iOS 与 Android（真机、模拟器、模拟机）。Android 走 AVC/H.264 实测 104fps、iOS 模拟器 MJPEG 实测 131fps；另附 16 个模型工具、自动注册 mobilecli 自带 skill，并支持通过 Dart VM Service 直读 Flutter widget 树。零运行时依赖，浏览器只经 DSH 自己的 web 源，签名过期令牌 + loopback 传输层围栏。'
