# dsh-sidebar-mobile 的挂载层。
#
# 本插件把 mobilecli 二进制封装成 DSH 的移动设备层：Host 侧负责进程/流/工具/技能，
# Client 侧在右侧边栏开一个「移动设备」tab，渲染实时画面并转发点击。
#
# 它不依赖 @deepseek-ai/dsh-mcp-client —— mobilecli 不是 MCP server，而是一个
# 自带 JSON-RPC 接口的 Go 二进制。Host 半个自己管它的生命周期。
- insert:
    - id: dsh-sidebar-mobile
      name: '@j62268781-alt/dsh-sidebar-mobile'
      config:
        # 部署层总开关。关掉后插件仍会加载，但不挂流路由、不注册工具与技能。
        enabled: true

        # mobilecli 二进制路径。
        #   null（默认）→ 自动解析：MOBILECLI_PATH 环境变量 → PATH 上的 mobilecli
        #                 → 本包 node_modules 里的平台包
        #   字符串      → 直接用这个路径（绝对路径，或能被 PATH 解析的命令名）
        binaryPath: null

        # mobilecli daemon 的状态目录（MOBILECLI_HOME）。
        #   null（默认）→ ~/.mobilecli，即 mobilecli 自己的默认值
        # 多个 DSH profile 想各用各的 daemon 时，各自指一个目录即可。
        # ⚠️ 同一个 daemon 同时只能服务一个 DSH 进程，详见 README「已知边界」。
        homeDir: null

        # 流路由的挂载前缀（`/_dsh/dsh-sidebar-mobile/*`）。改动通常没有必要。
        routePrefix: '/_dsh/dsh-sidebar-mobile'

        # 交互指令是否优先走 daemon 的 unix socket（JSON-RPC）。
        #   true（默认）→ 优先 RPC；停用不可用通道，仅连接确认未建立时回退 CLI
        #   false       → 全部走 CLI（排查用）
        #
        # 历史实测 tap 7.3ms vs 104.2ms 只代表一加 12 样本。Windows Node 可能收到
        # EACCES/EPERM（连接前失败）：当前操作回退 CLI，之后直接走 CLI。业务错误或
        # 响应中断不回放当前操作，避免不确定时重复点击。`rotate` 没有 RPC 实现。
        useDaemonRpc: true

        # judgment 驱动的有界 mobile loop，默认关闭。
        # 开启前须在 DSH 注册 dsh-judgment，并配置这里指定的 purpose。
        # 每次判断会发送目标和最多 12 个控件标签；只遮蔽邮箱/长数字并截断，不是通用隐私脱敏。
        # 不发送截图或完整 UI 树；不要在包含敏感信息的屏幕启用。
        mobileLoop:
          enabled: false
          purpose: 'mobile.action'

        # 是否把 mobilecli 自带的 skill（skills/mobilecli/*.md）注册给模型。
        # 关掉只影响「模型知不知道这套命令」，不影响面板与工具本身。
        registerSkills: true

        # 流的中断策略。
        stream:
          # 没有任何消费者（面板关着、没有卡片挂着）时，多少秒后停掉流。
          # 停掉不是崩溃：下一次打开面板或调用工具会自动重启。
          idleStopSeconds: 300

          # 流崩了之后自动重启的延迟（毫秒）。
          restartDelayMs: 5000

          # AVC 码率（bps，mobilecli 允许 100000–10000000）。
          # ⚠️ 不传时 mobilecli 的默认值很低：实测 1080×2400 的 Xiaomi 15 Pro
          #    静止 0.98 Mbps、滑动 2.15 Mbps —— 大范围运动时码率不够，
          #    编码器只能糊掉细节，这是"画面糊"的主因。
          #    传 8000000 后同一场景滑动可达 4.88 Mbps，清晰度明显改善。
          bitrate: 8000000

          # 帧率上限。⚠️ 实测传下去**不生效**：
          #    不传 → 120.6fps / --fps 30 → 105.5fps / --fps 15 → 100.7fps
          #    传什么都是 ~120fps。保留它有两个用处：① 上游修好后自动生效；
          #    ② 排查时命令行里能看到期望值。
          #    真正起作用的限流在**客户端渲染侧**：每帧都解码（保住 H.264
          #    参考链，丢 P 帧会花屏），但只按 30fps 绘制 —— 见 client.js
          #    的 TARGET_RENDER_FPS。
          maxFps: 30

          # 默认缩放。0.5 在 iOS 模拟器上实测 104fps / 6.6Mbps，
          # 全分辨率 131fps / 20.6Mbps。画质优先就保持 1.0。
          defaultScale: 1.0

        # 面板尺寸的默认值（用户可在面板里改，改完记在本地）。
        panel:
          # 'fit' | 50 | 75 | 100 | 125
          defaultSize: 'fit'
          # 'frameless' | 'bezel' | 'device'
          defaultFrame: 'bezel'

        # 安全：经过反向代理访问时，把对外的 authority 显式列在这里，
        # 否则 Host 头不是 loopback 的请求一律 403。
        # 与 dsh-android 的 trustedAuthorities 同一套语义：
        #   host            → 任意 Host 端口
        #   host:port       → 精确匹配
        #   https://host:port → 同时钉住 scheme
        trustedAuthorities: []
